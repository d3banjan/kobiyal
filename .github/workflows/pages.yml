name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: GITHUB_PAGES=true bun run build
      - name: Verify generated metadata
        run: |
          grep -q "বেলা অবেলা কালবেলা" dist/poems/jibanananda-070/index.html
          grep -q $'\u09eb\u09ea-\u09eb\u09eb' dist/poems/jibanananda-070/index.html
          ! grep -q "#বেলা অবেলা কালবেলা" dist/poems/jibanananda-070/index.html
          python3 scripts/source_acquisition_manifest.py --verify-manifest metadata_reports/source-acquisition-manifest.current.json
          python3 scripts/verify_rendered_book_pages.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
